plugins {
    id 'java'
    alias(nyfs.plugins.mdg.loader)
    id 'multiloader-datagen'
}

repositories {
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    implementation(nyfs.geckolib.neoforge)
    implementation(nyfs.sbl.neoforge)
    implementation(nyfs.config.api.neoforge)
    implementation("com.nyfaria.awcapi:awcapi-neoforge-26.1:1.0.2")
}
