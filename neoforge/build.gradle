plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.mdg.loader)
    id 'multiloader-moddev'
    id 'com.nyfaria.moddingtools.publishing'
    id("com.nyfaria.moddingtools.dependencies")
}

dependencies {
    modDeps.requiredMod(nyfs.geckolib.neoforge, "geckolib", null)
    modDeps.requiredMod(nyfs.sbl.neoforge, "smartbrainlib", null)
    modDeps.requiredMod(nyfs.config.api.neoforge, "forgeconfigapiport", null)
}
